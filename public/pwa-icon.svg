<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="livecall-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="50%" stop-color="#181B26" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>
    <linearGradient id="livecall-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#livecall-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#livecall-accent)" stroke-width="6" opacity="0.6" />

  <!-- Background decorative pulse circle -->
  <circle cx="256" cy="256" r="170" fill="url(#livecall-accent)" opacity="0.12" filter="url(#glow)" />
  
  <!-- Video Camera Icon Group -->
  <g transform="translate(116, 136)">
    <!-- Video Body -->
    <rect x="0" y="30" width="180" height="180" rx="36" fill="url(#livecall-accent)" filter="url(#glow)" />
    
    <!-- Heart / Sparkle Motif in Video Center -->
    <path d="M90 70 C75 50, 45 55, 45 85 C45 115, 90 150, 90 150 C90 150, 135 115, 135 85 C135 55, 105 50, 90 70 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Video Lens Triangle -->
    <path d="M196 74 L276 34 C286 28, 296 36, 296 48 L296 192 C296 204, 286 212, 276 206 L196 166 Z" fill="url(#livecall-accent)" />
    
    <!-- Live dot badge -->
    <circle cx="150" cy="56" r="14" fill="#22C55E" stroke="#0F1115" stroke-width="4" />
  </g>
</svg>
